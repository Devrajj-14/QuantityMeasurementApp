# ============================================
# Quantity Measurement App - Configuration
# ============================================

# Repository type: "cache" (in-memory) or "database" (H2 JDBC)
repository.type=database

# H2 Database Configuration
db.url=jdbc:h2:./quantitydb
db.username=sa
db.password=
db.pool.size=5

# Test Database Configuration
test.db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
test.db.username=sa
test.db.password=

# Logging
logging.level.root=INFO
